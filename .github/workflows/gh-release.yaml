name: Create packer-plugin-cnspec GitHub Release

## Only trigger release when the VERSION file changed on main branch
on:
  push:
    paths:
      - "VERSION"
    branches:
      - main
  workflow_dispatch:

env:
  # C07QZDJFF89 == #release-coordination
  SLACK_BOT_CHANNEL_ID: "C07QZDJFF89"

jobs:
  create-gh-release:
    name: GH Release
    permissions:
      contents: write
    runs-on: ubuntu-latest
    # Step outcomes and the version are exposed for the notify job.
    outputs:
      version: ${{ steps.version.outputs.version }}
      release_outcome: ${{ steps.release.outcome }}
      build_outcome: ${{ steps.check_release_file.outcome }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set release version
        id: version
        run: |
          VERSION=$(cat VERSION)
          # The version becomes a tag, a URL path and Slack text. Holding it to
          # semver keeps it free of anything any of those would read as markup.
          if [[ ! "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::VERSION '$VERSION' is not a semver tag like v1.2.3"
            exit 1
          fi
          echo "RELEASE_VERSION=$VERSION" >> $GITHUB_ENV
          echo "version=$VERSION" >> $GITHUB_OUTPUT
      # fetch a token for the mondoo-mergebot app
      - name: Generate token
        id: generate-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          # client-id accepts the same value as the old app-id input, see
          # https://github.com/actions/create-github-app-token/blob/v3.1.1/main.js#L21
          client-id: ${{ secrets.MONDOO_MERGEBOT_APP_ID }}
          private-key: ${{ secrets.MONDOO_MERGEBOT_APP_PRIVATE_KEY }}
      - name: Release
        id: release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          tag_name: ${{ env.RELEASE_VERSION }}
          generate_release_notes: true
          make_latest: true
          token: ${{ steps.generate-token.outputs.token }}
      # goreleaser (release.yaml) uploads the assets once the tag exists. This
      # step waits for them, and its outcome is the "Build" status in Slack.
      - name: Release file present?
        id: check_release_file
        uses: nick-fields/retry@ad984534de44a9489a53aefd81eb77f87c70dc60 # v4.0.0
        with:
          retry_wait_seconds: 30
          timeout_seconds: 5
          max_attempts: 120
          retry_on: error
          warning_on_retry: false
          # error on HTTP code different to 302
          command: curl -o /dev/null -s -w "%{http_code}\n" "https://github.com/mondoohq/packer-plugin-cnspec/releases/download/${{ env.RELEASE_VERSION }}/packer-plugin-cnspec_${{ env.RELEASE_VERSION }}_SHA256SUMS" | grep 302

  notify:
    name: Report the release to Slack
    # A skipped release job means nothing was attempted, so there is nothing
    # to report, and certainly nothing to page @here about.
    if: ${{ always() && needs.create-gh-release.result != 'skipped' }}
    needs: [create-gh-release]
    runs-on: ubuntu-latest
    steps:
      - name: Compose the message
        id: meta
        env:
          RELEASE: ${{ needs.create-gh-release.outputs.release_outcome }}
          BUILD: ${{ needs.create-gh-release.outputs.build_outcome }}
          JOB: ${{ needs.create-gh-release.result }}
          # Through env rather than `${{ }}` inline: an expression is pasted into
          # the script before bash parses it, so a value carrying a quote or `$(…)`
          # would be read as shell rather than as text.
          VERSION: ${{ needs.create-gh-release.outputs.version }}
        run: |
          set -euo pipefail

          # The release job only lets a semver version through, so it needs no
          # escaping for the YAML scalar, the Slack text or the URL it lands in.
          # It is empty when the release job stopped before reading VERSION.
          VERSION=${VERSION:-unknown}
          # Link the release only when it was actually created; otherwise the
          # tag it points at does not exist.
          if [ "$RELEASE" = "success" ]; then
            notes="<https://github.com/$GITHUB_REPOSITORY/releases/tag/$VERSION|$VERSION>"
          else
            notes="none, no release was created"
          fi
          {
            echo "version=$VERSION"
            echo "notes=$notes"
          } >> "$GITHUB_OUTPUT"

          # The job result decides: it is success only when every step, the
          # release and the build check included, succeeded.
          ok=false
          if [ "$JOB" = "success" ]; then
            ok=true
          fi

          if [ "$ok" = "true" ]; then
            echo "header=:rocket: packer-plugin-cnspec $VERSION released" >> "$GITHUB_OUTPUT"
            echo "mention=" >> "$GITHUB_OUTPUT"
          else
            echo "header=:x: packer-plugin-cnspec $VERSION failed to release" >> "$GITHUB_OUTPUT"
            echo "mention=<!here> " >> "$GITHUB_OUTPUT"
          fi

          # Packer releases are always stable and marked as latest.
          echo "channel_line=:package: *stable* — this is what a default install gets" >> "$GITHUB_OUTPUT"

          # Emits the value only. The label and the newline stay in the Slack payload,
          # where `\n` inside a double-quoted YAML scalar is a real escape.
          status() {
            case "$1" in
              success) echo ":white_check_mark: Done" ;;
              skipped) echo ":double_vertical_bar: Skipped" ;;
              cancelled) echo ":no_entry_sign: Cancelled" ;;
              "")      echo ":grey_question: Not run" ;;
              *)       echo ":x: $1" ;;
            esac
          }
          {
            echo "release_status=$(status "$RELEASE")"
            echo "build_status=$(status "$BUILD")"
          } >> "$GITHUB_OUTPUT"

      - name: Post to Slack
        continue-on-error: true
        uses: slackapi/slack-github-action@dcb1066f776dd043e64d0e8ba94ca15cc7e1875d # v4.0.0
        with:
          method: chat.postMessage
          token: ${{ secrets.SLACK_BOT_TOKEN }}
          payload: |
            channel: "${{ env.SLACK_BOT_CHANNEL_ID }}"
            text: "${{ steps.meta.outputs.mention }}${{ steps.meta.outputs.header }}"
            blocks:
              - type: "header"
                text:
                  type: "plain_text"
                  text: "${{ steps.meta.outputs.header }}"
                  emoji: true
              - type: "section"
                text:
                  type: "mrkdwn"
                  text: "${{ steps.meta.outputs.channel_line }}"
              - type: "section"
                fields:
                  - type: "mrkdwn"
                    text: "*Repository:*\n`${{ github.repository }}`"
                  - type: "mrkdwn"
                    text: "*Version:*\n`${{ steps.meta.outputs.version }}`"
                  - type: "mrkdwn"
                    text: "*Triggered by:*\n${{ github.actor }}"
                  - type: "mrkdwn"
                    text: "*Workflow run:*\n<https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}|Open run>"
              - type: "section"
                fields:
                  - type: "mrkdwn"
                    text: "*GitHub release:*\n${{ steps.meta.outputs.release_status }}"
                  - type: "mrkdwn"
                    text: "*Build:*\n${{ steps.meta.outputs.build_status }}"
              - type: "section"
                text:
                  type: "mrkdwn"
                  text: "*Release notes:*\n${{ steps.meta.outputs.notes }}"
